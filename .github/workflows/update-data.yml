name: Update data (results)

# Refreshes data/results.json on a schedule, then commits any changes.
# GitHub Pages redeploys automatically on push.
#
# Setup (one time):
#   1. Free key at https://www.football-data.org/client/register
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FOOTBALL_DATA_TOKEN   Value: <your token>
# The fetch script no-ops (exit 0) if the secret is missing, so this workflow
# is safe to enable before the token is configured.
#
# Injuries & suspensions are NOT automated here (no free source). scripts/
# fetch-availability.mjs (API-Football, needs a paid plan) is kept for later;
# until then, edit player `status` in data/squads.json by hand if desired.

on:
  schedule:
    - cron: '0 */3 * * *'        # baseline: every 3 hours, all year
    # World Cup 2026 window (UTC): poll every 5 min for near-live scores. The fetch
    # script writes nothing when scores are unchanged, so off-match-hour runs make
    # no commit and trigger no Pages rebuild. 5 min is GitHub's cron floor and may
    # be delayed under load , combined with free-tier data + CDN cache, expect a
    # few-minutes lag, not real-time.
    - cron: '*/5 * 11-30 6 *'    # Jun 11-30
    - cron: '*/5 * 1-19 7 *'     # Jul 1-19
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # allow the action to commit refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-results.mjs

      - name: Fetch scorers
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-scorers.mjs

      - name: Fetch weather
        run: node scripts/fetch-weather.mjs   # Open-Meteo, no API key

      - name: Commit & push if changed
        # Pull-rebase + retry the push: long-running fetches (5 min jobs during the
        # tournament) frequently overlap with human pushes to main, so a naive `git push`
        # is rejected as non-fast-forward. Rebase the data commit on top of whatever
        # landed and retry up to 3 times before giving up.
        run: |
          git config user.name  "wc2026-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/squads.json data/scorers.json data/weather.json
          if git diff --staged --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "data: auto-update results [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "Pushed on attempt $i."; exit 0
            fi
            echo "Push attempt $i rejected; pulling and retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::Push failed after 3 attempts , probable persistent contention on main."
          exit 1
