name: Update data (results)

# Refreshes data/results.json on a schedule, then commits any changes.
# GitHub Pages redeploys automatically on push.
#
# Setup (one time):
#   1. Free key at https://www.football-data.org/client/register
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FOOTBALL_DATA_TOKEN   Value: <your token>
# The fetch script no-ops (exit 0) if the secret is missing, so this workflow
# is safe to enable before the token is configured.
#
# Injuries & suspensions are NOT automated here (no free source). scripts/
# fetch-availability.mjs (API-Football, needs a paid plan) is kept for later;
# until then, edit player `status` in data/squads.json by hand if desired.

on:
  schedule:
    - cron: '0 */3 * * *'        # every 3 hours (tighten on match days for fresher scores)
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # allow the action to commit refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-results.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "wc2026-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/squads.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: auto-update results [skip ci]"
            git push
          fi
