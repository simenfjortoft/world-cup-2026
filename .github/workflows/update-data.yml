name: Update data (results + availability)

# Refreshes data/results.json and squad availability on a schedule, then
# commits any changes. GitHub Pages redeploys automatically on push.
#
# Setup (one time):
#   1. Create a free key at https://www.api-football.com/
#   2. Repo → Settings → Secrets and variables → Actions → New secret
#      Name: APISPORTS_KEY   Value: <your key>
# The fetch scripts no-op (exit 0) if the secret is missing, so this workflow
# is safe to enable before the key is configured.

on:
  schedule:
    - cron: '0 */3 * * *'        # every 3 hours (tighten on match days if you want fresher scores)
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # allow the action to commit refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch results
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/fetch-results.mjs

      - name: Fetch availability (injuries + suspensions)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/fetch-availability.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "wc2026-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/squads.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: auto-update results + availability [skip ci]"
            git push
          fi
